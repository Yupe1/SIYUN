
server:
  port: 8081
  servlet:
    context-path:
    session:
      cookie:
        same-site: lax # ?? none?? none ???? https
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/SIYUN?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2b8&allowPublicKeyRetrieval=true
    username: root
    password: 1234
  servlet:
    multipart:
      enabled: true # open file upload?default?
      max-file-size: 500MB
      max-request-size: 500MB
      file-size-threshold: 5MB
      resolve-lazily: false
      location: ./temp # temp file store url?choose?
  web:
    resources:
      static-locations: classpath:/static/,file:${upload.root-path}/

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.yupe.siyun.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

upload:
  # ?? Mac ? Nginx ??? Web ???
  root-path: /opt/homebrew/var/www/siyun-upload/
  # ?????????? Linux ?????????
  # root-path: /www/siyun/upload/
  url-prefix: /uploaded/
  # ?????????true=???false=???????S3/OSS?
  enable-local-storage: true

  house-path: uploaded/house/media/
  house-cover-path: uploaded/house/cover/
  head-path: uploaded/house/head/
  agreement-path: uploaded/house/agreement/

  # ?????????
  profile:

    # ===== 1. ?????? =====
    avatar:
      # ????
      path: uploaded/avatars
      # ????
      max-size: 2MB
      # ???????
      allowed-types: jpg,jpeg,png,gif,webp
      # ??????
      width: 500
      # ??????
      height: 500
      # ????????
      enable-compress: true
      # ???? (1-100)
      compress-quality: 85

    # ===== 2. ?????? =====
    course:
      # ????
      cover:
        path: uploaded/courses/covers
        max-size: 5MB
        allowed-types: jpg,jpeg,png,webp
        # ?????
        width: 1280
        height: 720
        enable-compress: true
        compress-quality: 90

      # ????
      video:
        path: uploaded/courses/videos
        max-size: 500MB
        allowed-types: mp4,mkv,avi,flv,mov,wmv,webm
        # ??????????
        enable-transcode: false
        # ?????
        enable-thumbnail: true

      # ?????????
      detail:
        path: uploaded/courses/details
        max-size: 50MB
        allowed-types: jpg,jpeg,png,gif,webp

    # ===== 3. ?????? =====
    article:
      # ????
      cover:
        path: uploaded/articles/covers
        max-size: 5MB
        allowed-types: jpg,jpeg,png,webp
        width: 1200
        height: 675
        enable-compress: true
        compress-quality: 90

      # ?????????
      content:
        path: uploaded/articles/contents
        max-size: 50MB
        allowed-types: jpg,jpeg,png,gif,webp

    # ===== 4. ?????? =====
    goods:
      # ????
      image:
        path: uploaded/goods/images
        max-size: 5MB
        allowed-types: jpg,jpeg,png,webp
        width: 800
        height: 800
        enable-compress: true
        compress-quality: 90

      # ?????
      detail-images:
        path: uploaded/goods/detail-images
        max-size: 50MB
        allowed-types: jpg,jpeg,png,gif,webp

    # ===== 5. ?????? =====
    position:
      # ??/????
      file:
        path: uploaded/position-apply/files
        max-size: 20MB
        # ????????
        allowed-types: pdf,doc,docx,xls,xlsx,zip,rar,7z,txt,rtf
        # ?????????
        forbidden-types: exe,bat,cmd,sh,py,java,class

    # ===== 6. ?????? =====
    marketing:
      # ?????
      coupon:
        path: uploaded/marketing/coupons
        max-size: 2MB
        allowed-types: jpg,jpeg,png,webp
        width: 400
        height: 200
        enable-compress: true
        compress-quality: 85

      # ???
      carousel:
        path: uploaded/marketing/carousels
        max-size: 5MB
        allowed-types: jpg,jpeg,png,webp
        width: 1920
        height: 620
        enable-compress: true
        compress-quality: 90

      # ??????
      banner:
        path: uploaded/marketing/banners
        max-size: 5MB
        allowed-types: jpg,jpeg,png,gif,webp

    # ===== 7. ?????? =====
    feedback:
      # ????
      image:
        path: uploaded/feedback/images
        max-size: 5MB
        allowed-types: jpg,jpeg,png,gif,webp